[project]
name = "smooai-smooth-operator-server"
version = "1.58.10"
description = "Native async WebSocket server for the smooth-operator protocol — parity with the Rust and C# reference servers, consuming the in-process smooai-smooth-operator-core engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # The engine the server runs in-process per turn. `SmoothAgent.run_stream(...)`
    # is mapped onto the protocol's stream_token / stream_chunk / eventual_response.
    "smooai-smooth-operator-core>=1.8.3",
    # asyncio WebSocket transport (server side).
    "websockets>=12",
    # OpenTelemetry GenAI spans on the turn/tool path (parity with the Rust server's
    # gen_ai.chat / gen_ai.tool spans). The api+sdk are enough to create spans and to
    # test them with an in-memory exporter; the OTLP exporter is the optional `otel`
    # extra below (only needed to actually ship spans to a collector).
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.optional-dependencies]
# OTLP span exporter, installed only where the server ships spans to a collector
# (OTEL_EXPORTER_OTLP_ENDPOINT set). Absent ⇒ init_telemetry logs + runs exporter-less.
otel = ["opentelemetry-exporter-otlp-proto-grpc>=1.20"]
# A live (non-mock) turn needs an OpenAI-compatible async client against the
# SmooAI gateway. Optional: the server is fully testable on MockLlmProvider with
# no gateway, and protocol-only paths (create/get/ping) need no LLM at all.
gateway = ["openai>=1.40"]
# Durable Postgres storage (SMOOTH_AGENT_STORAGE=postgres). Optional: the server is
# fully usable — and fully tested — on the in-memory stores, and nothing imports
# `postgres_store` unless that env var selects it.
postgres = ["asyncpg>=0.29"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    # The turn round-trip test drives the engine on MockLlmProvider, which ships
    # in smooai-smooth-operator-core — no gateway needed.
    # The Postgres store tests run against a real database in a throwaway container;
    # they skip cleanly when Docker is unavailable.
    "asyncpg>=0.29",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smooth_operator_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
